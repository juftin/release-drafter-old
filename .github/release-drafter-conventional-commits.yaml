name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: $PREVIOUS_TAG...$NEXT_TAG

categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking'
      - 'breaking-change'
  - title: '🚀 Features & Enhancements'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
  - title: '⚡ Performance Improvements'
    labels:
      - 'perf'
      - 'performance'
  - title: '📚 Documentation'
    labels:
      - 'docs'
      - 'documentation'
  - title: '📦 Dependency Updates'
    labels:
      - 'dependencies'
      - 'deps'
  - title: '🧰 Maintenance & Code Quality'
    labels:
      - 'refactor'
      - 'chore'
      - 'style'
      - 'build'
      - 'ci'
      - 'test'
  - title: '🔄 Reverts'
    labels:
      - 'revert'

version-resolver:
  major:
    labels:
      - 'breaking'
      - 'breaking-change'
  minor:
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
      - 'perf'
      - 'performance'
      - 'refactor'
      - 'dependencies'
      - 'deps'
      - 'chore'
      - 'docs'
      - 'documentation'
      - 'ci'
      - 'build'
      - 'test'
      - 'style'
      - 'revert'
  default: patch

autolabeler:
  # Breaking Changes
  - label: 'breaking'
    title:
      - '/^[a-z]+(\([^\)]+\))?!:/i'
      - '/^BREAKING( CHANGE)?(:|(\([^\)]+\))?:)/i'
      - '/BREAKING CHANGE/i'
    branch:
      - '/.*breaking.*/i'

  # Features
  - label: 'feat'
    title:
      - '/^feat(\([^\)]+\))?:/i'
      - '/^feature(\([^\)]+\))?:/i'
    branch:
      - '/^feat(\/|-)/i'
      - '/^feature(\/|-)/i'

  # Fixes
  - label: 'fix'
    title:
      - '/^fix(\([^\)]+\))?:/i'
      - '/^bugfix(\([^\)]+\))?:/i'
      - '/^hotfix(\([^\)]+\))?:/i'
    branch:
      - '/^fix(\/|-)/i'
      - '/^bugfix(\/|-)/i'
      - '/^hotfix(\/|-)/i'

  # Performance
  - label: 'perf'
    title:
      - '/^perf(\([^\)]+\))?:/i'
      - '/^performance(\([^\)]+\))?:/i'
    branch:
      - '/^perf(\/|-)/i'

  # Documentation
  - label: 'docs'
    title:
      - '/^docs?(\([^\)]+\))?:/i'
    branch:
      - '/^docs?(\/|-)/i'

  # Refactoring
  - label: 'refactor'
    title:
      - '/^refactor(\([^\)]+\))?:/i'
    branch:
      - '/^refactor(\/|-)/i'

  # Tests
  - label: 'test'
    title:
      - '/^tests?(\([^\)]+\))?:/i'
    branch:
      - '/^tests?(\/|-)/i'

  # Dependencies
  - label: 'dependencies'
    title:
      - '/^deps?(\([^\)]+\))?:/i'
      - '/^dependencies(\([^\)]+\))?:/i'
      - '/^chore\(deps(-[a-z0-9]+)?\):/i'
    branch:
      - '/^dependabot\//i'
      - '/^renovate\//i'
      - '/^deps?(\/|-)/i'

  # Build
  - label: 'build'
    title:
      - '/^build(\([^\)]+\))?:/i'
    branch:
      - '/^build(\/|-)/i'

  # CI
  - label: 'ci'
    title:
      - '/^ci(\([^\)]+\))?:/i'
    branch:
      - '/^ci(\/|-)/i'

  # Chores & Maintenance
  - label: 'chore'
    title:
      - '/^chore(\([^\)]+\))?:/i'
    branch:
      - '/^chore(\/|-)/i'

  # Code Style
  - label: 'style'
    title:
      - '/^style(\([^\)]+\))?:/i'
    branch:
      - '/^style(\/|-)/i'

  # Reverts
  - label: 'revert'
    title:
      - '/^revert(\([^\)]+\))?:/i'
    branch:
      - '/^revert(\/|-)/i'
