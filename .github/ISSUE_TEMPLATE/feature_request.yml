name: Feature Request
description: Suggest an idea or enhancement for Release Drafter
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a new feature or improvement!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen or which regex / preset / category to add.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features considered.
